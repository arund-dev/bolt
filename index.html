function chk(){if(!isAwake()||lvl()>=LOW||Date.now()-S.hyd.nt<36e5)return;S.hyd.nt=Date.now();save();notify('Lock In','Your glass is running low. Take a few sips?')}
function waterCard(){const l=lvl(),n=S.water[iso()]||0;
return`<div class="panel"><span class="cap">WATER</span><div class="row" style="align-items:center"><svg id="gsv" viewBox="0 0 84 116" width="96" style="flex:none;--wc:${l<LOW?'#d98a7a':'#7fb7c9'}"><defs><clipPath id="gc"><path d="M5 5H79L71 111H13Z"/></clipPath></defs><g clip-path="url(#gc)"><g id="wt" style="transform:translateY(${(1-l)*108}px);transition:transform 1s cubic-bezier(.3,1.3,.5,1)"><rect x="-10" y="8" width="104" height="130" fill="var(--wc)"/><path class="wv" d="M-30 8q10 -7 20 0t20 0t20 0t20 0t20 0t20 0t20 0t20 0t20 0" fill="var(--wc)"/></g></g><path d="M5 5H79L71 111H13Z" fill="none" stroke="var(--ln)" stroke-width="4" stroke-linejoin="round"/></svg><div><div class="hf" style="font-size:34px" id="wp">${Math.round(l*100)}%</div><small id="wn"></small><br><small>${n} glass${n==1?'':'es'} today</small></div></div><div class="row"><button class="btn p" data-a="sip">+ GLASS</button>${'Notification'in window&&Notification.permission=='default'?'<button class="btn g" data-a="notif">REMIND ME</button>':''}</div></div>`}
const moodRow=(a,v)=>`<div class="moods">${ME.map((m,i)=>`<button data-a="${a}" data-i="${i+1}" class="${v==i+1?'on':''}">${m}</button>`).join('')}</div>`;
function vHome(){const T=iso(),[n,rest]=pick(),h=new Date().getHours(),later=S.items.filter(i=>i.st=='later').length;
return`<div class="ch">CHAPTER · ${esc(S.chapter)}</div>
${free(T)?'<div class="panel"><span class="cap">TODAY</span>This day is set aside. Nothing is due. Rest well.</div>':`<div class="panel"><span class="cap">NEXT</span>${n?`<div class="hf nt">${esc(n.title)}</div><span class="chip">${esc(ty(n.type).name)}</span><span class="chip">${n.time||n.part}</span>${n.carried?'<span class="chip">carried over</span>':''}<div class="row"><button class="btn p" data-a="done" data-i="${n.id}">DONE</button><button class="btn" data-a="later" data-i="${n.id}">LATER</button></div>`:'<div class="hf nt">Nothing left.</div>Rest, or add something small in Plan.'}</div>`}
${rest.length?`<div class="panel"><span class="cap">COMING UP</span>${rest.slice(0,3).map(i=>`<div class="rw"><span>${esc(i.title)}</span><em>${i.time||i.part}</em></div>`).join('')}</div>`:''}
${later&&h>=19?`<div class="panel"><span class="cap">LATER BASKET</span>${later} waiting for a day.<div class="row"><button class="btn" data-a="nav" data-i="later">PLACE THEM</button></div></div>`:''}
${waterCard()}
${h>=19&&!S.log.some(l=>l.d==T&&l.k=='Day')?`<div class="panel"><span class="cap">EVENING</span>How did today go?${moodRow('mood',0)}<textarea id="evx" rows="2" placeholder="One line about today (optional)"></textarea><button class="btn p" data-a="evsave">SAVE</button></div>`:''}
${free(T)?'':'<button class="btn g wide" data-a="life">Life happened today</button>'}`}
function vPlan(){const T=iso(),sg=`<div class="seg">${['today','week','areas'].map(s=>`<button class="${seg==s?'on':''}" data-a="seg" data-i="${s}">${s.toUpperCase()}</button>`).join('')}</div>`;
if(seg=='today')return sg+`<div class="panel"><span class="cap">TODAY</span>${S.items.filter(i=>i.date==T&&i.st!='drop').sort(cmp).map(i=>`<div class="task ${i.st}"><div class="box" data-a="tog" data-i="${i.id}"></div><span data-a="tog" data-i="${i.id}">${esc(i.title)}</span><button class="mini" data-a="edit1" data-i="${i.id}">⋯</button></div>`).join('')||'Nothing today.'}</div><button class="btn wide" data-a="new1">+ ADD A TASK</button>`;
if(seg=='week')return sg+['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map((n,d)=>`<div class="panel"><span class="cap">${n}</span>${S.loop.filter(l=>l.days.includes(d)).sort(cmp).map(l=>`<div class="rw" data-a="editl" data-i="${l.id}"><span>${esc(l.title)}</span><em>${l.time.trim()||l.part}</em></div>`).join('')||'<small>free</small>'}</div>`).join('')+`<button class="btn wide" data-a="newl">+ ADD TO THE LOOP</button><div class="panel"><span class="cap">AWAY</span>${S.away.map((a,i)=>`<div class="rw"><span>${a.f} → ${a.t}</span><button class="mini" data-a="rmaway" data-i="${i}">✕</button></div>`).join('')}<div class="row"><input type="date" id="af" min="${T}"><input type="date" id="at" min="${T}"></div><button class="btn wide" style="margin:12px 0 0" data-a="away">SET AWAY</button></div>`;
return sg+S.areas.map(a=>`<div class="panel"><span class="cap">${esc(a.name)}</span>${S.types.filter(t=>t.area==a.id).map(t=>`<div class="rw"><span>${esc(t.name)}</span><span><button class="mini" data-a="rnt" data-i="${t.id}">✎</button><button class="mini" data-a="rmt" data-i="${t.id}">✕</button></span></div>`).join('')}<div class="row"><button class="btn" data-a="newt" data-i="${a.id}">+ TYPE</button><button class="btn g" data-a="rna" data-i="${a.id}">RENAME</button></div></div>`).join('')+'<button class="btn wide" data-a="newa">+ NEW AREA</button>'}
function vLater(){const l=S.items.filter(i=>i.st=='later');return'<h2>Later</h2>'+(l.map(i=>`<div class="panel"><span class="cap">${esc(ty(i.type).name)}</span>${esc(i.title)} <small>· pushed ${i.n}×</small><div class="row"><input type="date" id="d_${i.id}" min="${iso()}" value="${addD(iso(),1)}"><button class="btn p" data-a="place" data-i="${i.id}">PLACE</button></div><div class="row"><button class="btn" data-a="slot" data-i="${i.id}">NEXT SLOT</button><button class="btn g" data-a="drop" data-i="${i.id}">LET GO</button></div></div>`).join('')||'<div class="panel">The basket is empty.</div>')}
const vLog=()=>`<h2>The Log</h2><div class="panel"><select id="lk"><option>Note</option><option>Win</option><option>Reminder</option></select><textarea id="lx" rows="2" placeholder="What's on your mind?"></textarea><button class="btn p" data-a="logsave">SAVE</button></div>`+S.log.map(l=>`<div class="panel"><span class="cap">${l.k=='Day'?'DAY '+(ME[l.m-1]||''):esc(l.k)}</span><small>${l.d}</small><br>${esc(l.x||'')}</div>`).join('');
function vMe(){const w=S.items.filter(i=>i.st=='done'&&i.date>addD(iso(),-7));return`<h2>Me</h2><div class="panel"><span class="cap">MY BOOK</span><label class="avatar">${S.photo?`<img src="${S.photo}">`:'😎'}<input type="file" id="photo" accept="image/*" hidden></label><input id="chap" value="${esc(S.chapter)}" placeholder="Current chapter"><textarea id="bio" rows="3" placeholder="About me">${esc(S.bio)}</textarea></div><div class="panel"><span class="cap">THIS WEEK I…</span>${w.map(i=>`<div>✓ ${esc(i.title)}</div>`).join('')||'<small>Nothing yet. That is fine.</small>'}</div><div class="panel"><span class="cap">LOOK</span><select id="theme">${[['comic','Comic'],['comicdark','Comic dark'],['min','Minimal light'],['mindark','Minimal dark']].map(([v,n])=>`<option value="${v}" ${S.theme==v?'selected':''}>${n}</option>`).join('')}</select><small id="sync">${stat()}</small>${user?'<div class="row"><button class="btn g" data-a="out">SIGN OUT</button></div>':''}</div>`}
function tilt(){$$('.panel,.btn,.chip').forEach(e=>{let h=0;for(const c of e.textContent+e.className)h=(h*31+c.charCodeAt(0))>>>0;e.style.setProperty('--r',((h%41)/10-2)*(e.classList.contains('panel')?.25:.45))})}
function draw(){theme();const n=S.items.filter(i=>i.st=='later').length;$$('.page').forEach(p=>p.classList.toggle('on',p.id==pg));$$('nav button[data-i]').forEach(b=>b.classList.toggle('on',b.dataset.i==pg));$('#nl').textContent='LATER'+(n?' '+n:'');$('#'+pg).innerHTML={home:vHome,plan:vPlan,later:vLater,log:vLog,me:vMe}[pg]();tilt();glass()}
function sheet(o,mode){const isL=mode=='loop';$('#sb').innerHTML=`<h2 style="font-size:30px">${o.id?'Edit':'New'} ${isL?'loop task':'task'}</h2><input id="f_t" placeholder="What?" value="${esc(o.title||'')}"><select id="f_ty">${S.areas.map(a=>`<optgroup label="${esc(a.name)}">${S.types.filter(t=>t.area==a.id).map(t=>`<option value="${t.id}" ${t.id==o.type?'selected':''}>${esc(t.name)}</option>`).join('')}</optgroup>`).join('')}</select>${isL?`<div class="days">${DN.map((d,i)=>`<button class="btn g ${(o.days||[]).includes(i)?'on':''}" data-d="${i}">${d}</button>`).join('')}</div>`:`<input id="f_d" type="date" value="${o.date||iso()}">`}<div class="row"><select id="f_p">${PARTS.map(p=>`<option ${p==o.part?'selected':''}>${p}</option>`).join('')}</select><input id="f_tm" type="time" value="${(o.time||'').trim()}"><select id="f_s">${[1,2,3].map(n=>`<option value="${n}" ${n==(o.size||2)?'selected':''}>${['small','medium','big'][n-1]}</option>`).join('')}</select></div><div class="row">${o.id?'<button class="btn g" id="f_x">DELETE</button>':''}<button class="btn g" id="f_c">CANCEL</button><button class="btn p" id="f_ok">SAVE</button></div>`;
$('#modal').classList.add('on');const close=()=>$('#modal').classList.remove('on'),T=iso(),purge=l=>{S.items=S.items.filter(i=>!(i.src==l.id&&i.st=='todo'&&!i.carried&&i.date>=T))};
$$('.days .btn').forEach(b=>b.onclick=()=>b.classList.toggle('on'));$('#f_c').onclick=close;
if($('#f_x'))$('#f_x').onclick=()=>{if(isL){S.loop=S.loop.filter(x=>x!=o);purge(o)}else o.st='drop';close();commit()};
$('#f_ok').onclick=()=>{const v={title:$('#f_t').value.trim(),type:$('#f_ty').value,part:$('#f_p').value,time:$('#f_tm').value,size:+$('#f_s').value};if(!v.title)return;
if(isL){v.days=$$('.days .on').map(b=>+b.dataset.d);if(!v.days.length)return;if(o.id){Object.assign(o,v);purge(o)}else S.loop.push({id:uid(),...v})}
else{v.date=$('#f_d').value||T;if(o.id)Object.assign(o,v);else S.items.push({id:uid(),od:v.date,st:'todo',n:0,...v})}close();commit()}}
function act(a,i,b){const T=iso(),it=S.items.find(x=>x.id==i),ar=S.areas.find(x=>x.id==i),tp=S.types.find(x=>x.id==i);
switch(a){
case'nav':pg=i;scrollTo(0,0);break;
case'seg':seg=i;break;case'notif':Notification.requestPermission().then(draw);return;
case'done':it.st='done';break;
case'later':it.st='later';it.n++;break;
case'sip':S.hyd={lvl:Math.min(1,lvl()+.5),at:Date.now(),nt:0};S.water[T]=(S.water[T]||0)+1;break;
case'life':S.off.push(T);S.items.filter(x=>x.date==T&&x.st=='todo').forEach(x=>miss(x,addD(T,1)));break;
case'drop':it.st='drop';break;
case'tog':it.st=it.st=='done'?'todo':'done';break;
case'place':{const d=$('#d_'+i).value;if(d){it.date=d;it.st='todo';it.carried=1}break}
case'slot':moveNext(it,addD(T,1));break;
case'new1':sheet({date:T,part:'morning'},'one');return;case'edit1':sheet(it,'one');return;
case'newl':sheet({days:[0,1,2,3,4],part:'morning'},'loop');return;case'editl':sheet(S.loop.find(x=>x.id==i),'loop');return;
case'rnt':{const n=prompt('Rename type',tp.name);if(n)tp.name=n;break}
case'rmt':if(confirm('Remove this type?'))S.types=S.types.filter(x=>x!=tp);break;
case'newt':{const n=prompt('New type name');if(n)S.types.push({id:uid(),area:i,name:n});break}
case'rna':{const n=prompt('Rename area',ar.name);if(n)ar.name=n;break}
case'newa':{const n=prompt('New area name');if(n)S.areas.push({id:uid(),name:n});break}
case'away':{const f=$('#af').value,t=$('#at').value;if(!f||!t||t<f)return;S.away.push({f,t});S.items.filter(x=>x.date>=f&&x.date<=t&&x.st=='todo').forEach(x=>miss(x,addD(t,1)));break}
case'rmaway':S.away.splice(+i,1);break;
case'mood':ev=+i;$$('[data-a=mood]').forEach(x=>x.classList.toggle('on',x.dataset.i==i));return;
case'evsave':S.log.unshift({id:uid(),c:Date.now(),d:T,k:'Day',m:ev,x:$('#evx').value.trim()});break;
case'logsave':{const x=$('#lx').value.trim();if(!x)return;S.log.unshift({id:uid(),c:Date.now(),d:T,k:$('#lk').value,x});break}
case'out':if(Q.size&&!confirm(Q.size+' changes have not uploaded yet. Sign out anyway? They stay on this phone.'))return;sb.auth.signOut();user=null;$('#login').classList.add('on');return}
commit()}
document.addEventListener('click',e=>{touched=true;const b=e.target.closest('[data-a]');if(b)act(b.dataset.a,b.dataset.i,b)});
document.addEventListener('change',e=>{touched=true;const i=e.target.id;if(i=='chap')S.chapter=e.target.value;else if(i=='bio')S.bio=e.target.value;else if(i=='theme'){S.theme=e.target.value;theme()}else if(i=='photo'){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=256;const m=Math.min(im.width,im.height);c.getContext('2d').drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,256,256);S.photo=c.toDataURL('image/jpeg',.8);commit()};im.src=r.result};r.readAsDataURL(f);return}else return;save()});
$('#li').onclick=async()=>{const{data,error}=await sb.auth.signInWithPassword({email:$('#em').value,password:$('#pw').value});if(error)return $('#lerr').textContent=error.message;user=data.user;$('#login').classList.remove('on');if(fresh&&!touched)await freshStart();fresh=false;commit();syncNow()};
$('#skip').onclick=()=>{skipped=true;$('#login').classList.remove('on')};
document.addEventListener('visibilitychange',()=>{if(!document.hidden){commit();chk();syncNow()}});
let lastH=new Date().getHours();setTimeout(chk,2000);
let tk=0;setInterval(()=>{glass();chk();const h=new Date().getHours();if(h!=lastH&&pg=='home'&&!editing()&&!document.hidden)draw();lastH=h;if(!document.hidden&&++tk%3==0)syncNow()},30000);
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
globalThis.READY=(async()=>{await load();
if(window.supabase&&!SB_URL.startsWith('YOUR')){sb=supabase.createClient(SB_URL,SB_KEY);try{const{data}=await sb.auth.getSession();user=data.session&&data.session.user}catch(e){}if(!user&&navigator.onLine)$('#login').classList.add('on')}
if(user&&fresh&&navigator.onLine){await freshStart()}if(user)fresh=false;
commit();syncNow()})();
</script></body></html>
