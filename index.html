<style>

--rule:rgba(160,190,220,.09);--rule2:rgba(160,190,220,.2);--mar:rgba(217,71,59,.35);--tape:rgba(214,182,106,.34);--taptx:#efe6d0;--hl:rgba(214,182,106,.26);
--sh:0 8px 16px -12px rgba(0,0,0,.85);--wbg:#22343b;--whatch:rgba(127,183,201,.1);color-scheme:dark}
[data-theme=min]{--bg:#f6f6f4;--card:#fff;--ln:#d6d6d0;--tx:#222;--ac:#222;--on:#fff;--ac2:#ececE7;--ac3:#ececE7;--rule:rgba(0,0,0,.08);--rule2:rgba(0,0,0,.1);
--sh:none;--bw:1px;--rd:14px;--t:0;--hw:800;--ls:0;--hf:Nunito,system-ui,sans-serif;--pat:none;--mpat:none;--tape:transparent;--hl:transparent;--taptx:var(--tx);--gl:#b4b4ae;--wbg:#eaf3f6;--whatch:transparent}
[data-theme=mindark]{--bg:#121212;--card:#1c1c1c;--ln:#363636;--tx:#e8e8e8;--ac:#e8e8e8;--on:#121212;--ac2:#2a2a2a;--ac3:#2a2a2a;--rule:rgba(255,255,255,.08);--rule2:rgba(255,255,255,.1);
--sh:none;--bw:1px;--rd:14px;--t:0;--hw:800;--ls:0;--hf:Nunito,system-ui,sans-serif;--pat:none;--mpat:none;--tape:transparent;--hl:transparent;--taptx:var(--tx);--gl:#7a7a7a;--wbg:#1a2a30;--whatch:transparent;color-scheme:dark}
*{box-sizing:border-box}

.hf,h2,.btn,.cap,.chip,nav button,.seg button{font-family:var(--hf);font-weight:var(--hw);letter-spacing:var(--ls)}

.btn:active{translate:0 1px;filter:brightness(.95)}.btn.p{background:var(--ac);color:var(--on);border-color:var(--ac)}.btn.g{background:transparent}.wide{width:100%;margin-bottom:26px}

.page{display:none}.page.on{display:block}small{opacity:.65}

.mini{font:inherit;font-size:13px;background:none;border:var(--bw) solid var(--ln);border-radius:3px;color:var(--tx);padding:2px 7px;margin-left:4px;cursor:pointer}.mini.on{background:var(--ac2)}

.seg{display:flex;margin-bottom:24px}.seg button{flex:1;font-size:16px;white-space:nowrap;border:var(--bw) solid var(--ln);background:var(--card);color:var(--tx);padding:7px 0;margin-left:-1px;cursor:pointer}
.seg button:first-child{border-radius:var(--rd) 0 0 var(--rd);margin:0}.seg button:last-child{border-radius:0 var(--rd) var(--rd) 0}.seg .on{background:var(--ac);color:var(--on);border-color:var(--ac)}
.moods{display:flex;justify-content:space-between}.moods button{font-size:28px;background:none;border:var(--bw) solid transparent;border-radius:var(--rd);filter:grayscale(.7);cursor:pointer}.moods .on{border-color:var(--ln);filter:none}
.days{display:flex;gap:4px;margin:8px 0}.days .btn{flex:1;padding:6px 0;font-size:15px}.days .on{background:var(--ac);color:var(--on);border-color:var(--ac)}

.panel.water{background-color:var(--wbg);background-image:repeating-linear-gradient(45deg,var(--whatch) 0 2px,transparent 2px 11px)}
.panel label:not(.avatar){display:block;font-size:12px;font-weight:700;opacity:.8;margin-top:4px}.bars{position:relative;height:80px;display:flex;align-items:flex-end;gap:8px;margin-top:14px;border-bottom:1px solid var(--rule2)}.bars i{flex:1;background:var(--wc);border-radius:3px 3px 0 0;min-height:2px}.bars u{position:absolute;left:0;right:0;border-top:1px dashed var(--ln);opacity:.6}.blab{display:flex;gap:8px;margin-top:3px}.blab small{flex:1;text-align:center;font-size:11px}
.upnext{margin:-14px 4px 26px;font-size:13px;opacity:.75}nav sup{font-size:11px;background:var(--ac);color:var(--on);border-radius:8px;padding:0 5px;margin-left:3px;vertical-align:top;font-family:var(--bf);font-weight:800}.sheet .ch{margin:16px 0 4px}
.wv{animation:wv 2.4s linear infinite}@keyframes wv{to{transform:translateX(40px)}}@media(prefers-reduced-motion:reduce){.wv{animation:none}}
nav{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:auto;display:grid;grid-template-columns:1fr 1fr 80px 1fr 1fr;background:var(--bg);border-top:var(--bw) solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
nav button{background:none;border:0;color:var(--tx);font-size:17px;padding:16px 0 12px;cursor:pointer;opacity:.7}nav .on{opacity:1;box-shadow:inset 0 -3px 0 var(--ac)}
#homeBtn{position:fixed;left:50%;translate:-50% 0;bottom:calc(14px + env(safe-area-inset-bottom,0px));width:70px;height:70px;border-radius:50%;background:var(--ac);color:var(--on);border:var(--bw) solid var(--ac);font-size:30px;z-index:11;cursor:pointer;box-shadow:0 0 0 6px var(--bg),var(--sh)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;z-index:30}.modal.on{display:flex}
.sheet{width:100%;max-width:480px;margin:auto;background:var(--card);border:var(--bw) solid var(--ln);border-radius:16px 16px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));max-height:90vh;overflow:auto}
#login{position:fixed;inset:0;background:var(--bg);z-index:50;display:none;place-items:center;padding:20px}#login.on{display:grid}
</style></head><body>
<div class="wrap"><section class="page on" id="home"></section><section class="page" id="plan"></section><section class="page" id="log"></section><section class="page" id="wins"></section><section class="page" id="me"></section></div>
<button id="homeBtn" data-a="nav" data-i="home" aria-label="Home">⚡</button>
<nav><button data-a="nav" data-i="plan" id="np">PLAN</button><button data-a="nav" data-i="log">LOG</button><span></span><button data-a="nav" data-i="wins">WINS</button><button data-a="nav" data-i="me">ME</button></nav>
<div class="modal" id="modal"><div class="sheet" id="sb"></div></div>
<div id="login"><div class="panel" style="width:100%;max-width:360px"><h2>Lock In</h2><input id="em" type="email" placeholder="email" autocomplete="username"><input id="pw" type="password" placeholder="password" autocomplete="current-password"><small id="lerr"></small><div class="row"><button class="btn g" id="skip">OFFLINE</button><button class="btn p" id="li">ENTER</button></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SB_URL='YOUR_SUPABASE_URL',SB_KEY='YOUR_SUPABASE_ANON_KEY';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const uid=()=>Math.random().toString(36).slice(2,9),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const iso=d=>{d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,0)+'-'+String(d.getDate()).padStart(2,0)};
const addD=(s,n)=>{const d=new Date(s+'T12:00');d.setDate(d.getDate()+n);return iso(d)},dow=s=>(new Date(s+'T12:00').getDay()+6)%7;
const PARTS=['morning','afternoon','evening','night'],DN=['M','T','W','T','F','S','S'],ME=['😫','😕','😐','🙂','🔥'];
const cmp=(a,b)=>PARTS.indexOf(a.part)-PARTS.indexOf(b.part)||(a.time||'99').localeCompare(b.time||'99');
const L=(title,type,days,part,time,size)=>({id:uid(),title,type,days,part,time:time||'',size:size||2});
const DEF={theme:'notebook',planAt:'20:30',planned:'',wins:[],chapter:'Finding my feet',bio:'',photo:'',
areas:[{id:'a1',name:'Money'},{id:'a2',name:'Education'},{id:'a3',name:'Life'},{id:'a4',name:'Skills'}],
types:[{id:'t1',area:'a1',name:'Job hunt'},{id:'t2',area:'a2',name:'A/L'},{id:'t3',area:'a2',name:'Coding'},{id:'t4',area:'a3',name:'Gym'},{id:'t5',area:'a3',name:'Health'},{id:'t6',area:'a4',name:'Daily life'}],
loop:[L('Job applications','t1',[0,1,2,3,4],'morning'),L('Study coding','t3',[0,1,2,3,4],'afternoon','',2),L('Gym','t4',[0,2,4],'evening','17:00'),L('Cook something new','t6',[5],'afternoon'),L('Tidy my space','t6',[6],'morning',' ',1)],
items:[],off:[],away:[],log:[],waterLog:[],wake:'07:00',sleep:'22:30',waterGoal:2000,cup:250,waterOn:true};
let S=structuredClone(DEF),sb,user,tmr,pg='home',seg='today',ev=0,SH={},Q=new Map(),fresh=false,skipped=false,touched=false;
const ty=id=>S.types.find(x=>x.id==id)||{name:'Other'},free=d=>S.off.includes(d)||S.away.some(a=>d>=a.f&&d<=a.t),TH={comic:'notebook',comicdark:'notebookdark'},theme=()=>{document.documentElement.dataset.theme=TH[S.theme]||S.theme||'notebook';try{const m=document.querySelector('meta[name=theme-color]');if(m)m.content=getComputedStyle(document.documentElement).getPropertyValue('--bg').trim()}catch(e){}};
/* ===== local database (IndexedDB) + sync to Supabase =====
   S is what the screens read. Every save() compares S with SH (what we last knew per row)
   and puts the differences in Q (the upload queue). Q lives in IndexedDB until Supabase confirms. */
const MEM={};
const DB={idb:typeof indexedDB!='undefined',
open(){return this.p||(this.p=new Promise((res,rej)=>{const r=indexedDB.open('lockin',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}))},
async get(k){if(!this.idb)return MEM[k];const d=await this.open();return new Promise((res,rej)=>{const q=d.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})},
async setMany(o){if(!this.idb){for(const k in o)MEM[k]=structuredClone(o[k]);return}const d=await this.open();return new Promise((res,rej)=>{const t=d.transaction('kv','readwrite'),st=t.objectStore('kv');for(const k in o)st.put(o[k],k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})}};
let pchain=Promise.resolve();
const persist=()=>pchain=pchain.then(()=>DB.setMany({state:S,shadow:SH,queue:[...Q.values()]})).then(()=>{try{localStorage.removeItem('lockin')}catch(e){}}).catch(()=>{try{localStorage.setItem('lockin',JSON.stringify(S))}catch(e){}});
const TABLES=['areas','types','loop_tasks','tasks','log_entries','wins','water_log','settings'],SETK=['theme','chapter','bio','photo','off','away','planAt','planned','wake','sleep','waterGoal','cup','waterOn'];
const MAP={
areas:{get:()=>S.areas,row:a=>({name:a.name}),obj:r=>({id:r.id,name:r.name})},
types:{get:()=>S.types,row:t=>({area_id:t.area,name:t.name}),obj:r=>({id:r.id,area:r.area_id,name:r.name})},
loop_tasks:{get:()=>S.loop,row:l=>({title:l.title,type_id:l.type,days:l.days,part:l.part,at_time:l.time||'',size:l.size}),obj:r=>({id:r.id,title:r.title,type:r.type_id,days:r.days,part:r.part,time:r.at_time||'',size:r.size})},
tasks:{get:()=>S.items,row:i=>({src_id:i.src||null,orig_day:i.od||null,day:i.date||null,title:i.title,type_id:i.type,part:i.part,at_time:i.time||'',size:i.size,status:i.st,pushes:i.n||0,carried:!!i.carried}),obj:r=>({id:r.id,src:r.src_id||undefined,od:r.orig_day,date:r.day,title:r.title,type:r.type_id,part:r.part,time:r.at_time||'',size:r.size,st:r.status,n:r.pushes||0,carried:r.carried?1:undefined})},
water_log:{get:()=>S.waterLog,row:w=>({at:new Date(w.at).toISOString(),ml:w.ml}),obj:r=>({id:r.id,at:Date.parse(r.at),ml:r.ml})},
wins:{get:()=>S.wins,row:w=>({day:w.d,title:w.t,note:w.n||''}),obj:r=>({id:r.id,d:r.day,t:r.title,n:r.note||''})},
log_entries:{get:()=>S.log,row:l=>({day:l.d,kind:l.k,mood:l.m||null,body:l.x||'',created_at:l.c?new Date(l.c).toISOString():null}),obj:r=>({id:r.id,d:r.day,k:r.kind,m:r.mood||undefined,x:r.body||'',c:r.created_at?Date.parse(r.created_at):undefined})}};
function rowsOf(){const o={};for(const t in MAP)for(const x of MAP[t].get())o[t+':'+x.id]={t,id:x.id,row:MAP[t].row(x)};o['settings:main']={t:'settings',id:'main',row:{data:Object.fromEntries(SETK.map(k=>[k,S[k]]))}};return o}
function normalize(){for(const k of['energy','ask','qa','ts'])delete S[k];S.theme=TH[S.theme]||S.theme||'notebook';['areas','types','loop','items','off','away','log','wins'].forEach(k=>S[k]=S[k]||[]);S.wins.sort((a,b)=>b.d.localeCompare(a.d)||a.id.localeCompare(b.id));S.planAt=S.planAt||'20:30';S.waterLog=S.waterLog||[];if(S.water){for(const[d,n]of Object.entries(S.water))for(let k=0;k<n;k++)S.waterLog.push({id:'w_'+d+'_'+k,at:new Date(d+'T12:00').getTime()+k*6e4,ml:250})}delete S.water;delete S.hyd;S.log.forEach(l=>{if(!l.id)l.id=uid()});S.log.sort((a,b)=>b.d.localeCompare(a.d)||(b.c||0)-(a.c||0))}
function diff(){const cur=rowsOf(),ts=Date.now();for(const k in cur){const j=JSON.stringify(cur[k].row);if(SH[k]!==j){SH[k]=j;Q.set(k,{key:k,t:cur[k].t,id:cur[k].id,row:cur[k].row,ts})}}
for(const k in SH)if(!cur[k]){delete SH[k];const c=k.indexOf(':');Q.set(k,{key:k,t:k.slice(0,c),id:k.slice(c+1),row:null,ts})}}
const stat=()=>!user?(sb?'local only · not signed in':'local only'):!navigator.onLine?'offline · '+Q.size+' waiting to upload':Q.size?Q.size+' waiting to upload':'synced';
function status(){const e=$('#sync');if(e)e.textContent=stat()}
function save(){diff();persist();clearTimeout(tmr);tmr=setTimeout(flush,800);status()}
const iso8=t=>new Date(t).toISOString(),ack=o=>{if(Q.get(o.key)===o)Q.delete(o.key)};
function applyRows(t,rows){for(const r of rows){if(t=='settings'){if(!r.deleted&&r.data)SETK.forEach(f=>{if(r.data[f]!==undefined)S[f]=r.data[f]})}
else{const a=MAP[t].get(),i=a.findIndex(x=>x.id==r.id);if(r.deleted){if(i>=0)a.splice(i,1)}else if(i>=0)a[i]=MAP[t].obj(r);else a.push(MAP[t].obj(r))}}
const cur=rowsOf();rows.forEach(r=>{const k=t+':'+r.id;if(cur[k])SH[k]=JSON.stringify(cur[k].row);else delete SH[k]});normalize()}
let flushing=false;
async function flush(){if(!sb||!user||!navigator.onLine||flushing)return;flushing=true;
try{while(Q.size){const ops=[...Q.values()],by={};for(const o of ops)if(o.row)(by[o.t]=by[o.t]||[]).push(o);
for(const t in by)for(let i=0;i<by[t].length;i+=200){const ch=by[t].slice(i,i+200),m={};ch.forEach(o=>m[o.id]=o);
const{data,error}=await sb.from(t).upsert(ch.map(o=>({...o.row,id:o.id,user_id:user.id,deleted:false,updated_at:iso8(o.ts)})),{onConflict:'user_id,id'}).select();if(error)throw error;
ch.forEach(ack);const newer=(data||[]).filter(r=>m[r.id]&&Date.parse(r.updated_at)>m[r.id].ts);if(newer.length)applyRows(t,newer)}
for(const o of ops)if(!o.row){const{data,error}=await sb.from(o.t).update({deleted:true,updated_at:iso8(o.ts)}).eq('id',o.id).select();if(error)throw error;ack(o);const r=(data||[])[0];if(r&&!r.deleted&&Date.parse(r.updated_at)>o.ts)applyRows(o.t,[r])}}
}catch(e){console.warn('sync',e)}finally{flushing=false;persist();status()}}
async function pull(){if(!sb||!user||!navigator.onLine)return 0;let n=0;const cur=(await DB.get('cursor'))||{};
try{for(const t of TABLES){let off=0;const since=cur[t]||'1970-01-01T00:00:00+00:00';for(;;){const{data,error}=await sb.from(t).select('*').gt('synced_at',since).order('synced_at').order('id').range(off,off+999);if(error)throw error;
const take=[];for(const r of data){if(!cur[t]||r.synced_at>cur[t])cur[t]=r.synced_at;const k=t+':'+r.id,q=Q.get(k);if(q&&q.ts>=Date.parse(r.updated_at))continue;Q.delete(k);take.push(r)}

case'life':S.off.push(T);S.items.filter(x=>x.date==T&&x.st=='todo').forEach(x=>miss(x,addD(T,1)));break;
case'drop':it.st='drop';break;
case'tog':it.st=it.st=='done'?'todo':'done';break;
case'place':{const d=$('#d_'+i).value;if(d){it.date=d;it.st='todo';it.carried=1}break}
case'slot':moveNext(it,addD(T,1));break;
case'tmrw':it.date=nextOpen(addD(T,1));it.st='todo';it.carried=1;break;
case'plantm':planSheet();return;case'pclose':$('#modal').classList.remove('on');return;
case'pdone':S.planned=T;$('#modal').classList.remove('on');break;
case'ptm':it.date=nextOpen(addD(T,1));it.st='todo';it.carried=1;commit();planSheet();return;
case'pdrop':it.st='drop';commit();planSheet();return;
case'padd':sheet({date:nextOpen(addD(T,1)),part:'morning'},'one',planSheet);return;
case'winsave':{const t=$('#wi_t').value.trim();if(!t)return;S.wins.push({id:uid(),d:$('#wi_d').value||T,t,n:''});S.wins.sort((a,b)=>b.d.localeCompare(a.d)||a.id.localeCompare(b.id));break}
case'windel':if(!confirm('Remove this win?'))return;S.wins=S.wins.filter(x=>x.id!=i);break;
case'new1':sheet({date:T,part:'morning'},'one');return;case'edit1':sheet(it,'one');return;
case'newl':sheet({days:i==null?[0,1,2,3,4]:[+i],part:'morning'},'loop');return;case'editl':sheet(S.loop.find(x=>x.id==i),'loop');return;
case'rnt':{const n=prompt('Rename type',tp.name);if(n)tp.name=n;break}
case'rmt':if(confirm('Remove this type?'))S.types=S.types.filter(x=>x!=tp);break;
case'newt':{const n=prompt('New type name');if(n)S.types.push({id:uid(),area:i,name:n});break}
case'rna':{const n=prompt('Rename area',ar.name);if(n)ar.name=n;break}
case'newa':{const n=prompt('New area name');if(n)S.areas.push({id:uid(),name:n});break}
case'away':{const f=$('#af').value,t=$('#at').value;if(!f||!t||t<f)return;S.away.push({f,t});S.items.filter(x=>x.date>=f&&x.date<=t&&x.st=='todo').forEach(x=>miss(x,addD(t,1)));break}
case'rmaway':S.away.splice(+i,1);break;
case'mood':ev=+i;$$('[data-a=mood]').forEach(x=>x.classList.toggle('on',x.dataset.i==i));return;
case'evsave':S.log.unshift({id:uid(),c:Date.now(),d:T,k:'Day',m:ev,x:$('#evx').value.trim()});break;
case'logsave':{const x=$('#lx').value.trim();if(!x)return;S.log.unshift({id:uid(),c:Date.now(),d:T,k:$('#lk').value,x});break}
case'out':if(Q.size&&!confirm(Q.size+' changes have not uploaded yet. Sign out anyway? They stay on this phone.'))return;sb.auth.signOut();user=null;$('#login').classList.add('on');return}
commit()}
document.addEventListener('click',e=>{touched=true;if(e.target.id=='modal'){e.target.classList.remove('on');return}const b=e.target.closest('[data-a]');if(b)act(b.dataset.a,b.dataset.i,b)});
document.addEventListener('change',e=>{touched=true;const i=e.target.id;if(i=='chap')S.chapter=e.target.value;else if(i=='bio')S.bio=e.target.value;else if(i=='theme'){S.theme=e.target.value;theme()}else if(i=='planat'){S.planAt=e.target.value||'20:30'}else if(['wgoal','wcup','wwake','wsleep','wrem'].includes(i)){const v=e.target.value;if(i=='wgoal')S.waterGoal=Math.min(6000,Math.max(500,Math.round((+v||2)*1000)));else if(i=='wcup')S.cup=+v||250;else if(i=='wrem')S.waterOn=v=='1';else{const nw=i=='wwake'?v:S.wake,ns=i=='wsleep'?v:S.sleep;if(!nw||!ns||ns<=nw){draw();return}if(i=='wwake')S.wake=v;else S.sleep=v}save();draw();return}else if(i=='photo'){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=256;const m=Math.min(im.width,im.height);c.getContext('2d').drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,256,256);S.photo=c.toDataURL('image/jpeg',.8);commit()};im.src=r.result};r.readAsDataURL(f);return}else return;save()});
$('#li').onclick=async()=>{const{data,error}=await sb.auth.signInWithPassword({email:$('#em').value,password:$('#pw').value});if(error)return $('#lerr').textContent=error.message;user=data.user;$('#login').classList.remove('on');if(fresh&&!touched)await freshStart();fresh=false;commit();syncNow()};
$('#skip').onclick=()=>{skipped=true;$('#login').classList.remove('on')};
document.addEventListener('visibilitychange',()=>{if(!document.hidden){commit();chk();syncNow()}});
let lastH=new Date().getHours();setTimeout(chk,2000);
let tk=0;setInterval(()=>{glass();chk();const el=$('#el');if(el&&S.doing)el.textContent=since(S.doing.at);const h=new Date().getHours();if(h!=lastH&&pg=='home'&&!editing()&&!document.hidden)draw();lastH=h;if(!document.hidden&&++tk%3==0)syncNow()},30000);
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
globalThis.READY=(async()=>{await load();
if(window.supabase&&!SB_URL.startsWith('YOUR')){sb=supabase.createClient(SB_URL,SB_KEY);try{const{data}=await sb.auth.getSession();user=data.session&&data.session.user}catch(e){}if(!user&&navigator.onLine)$('#login').classList.add('on')}
if(user&&fresh&&navigator.onLine){await freshStart()}if(user)fresh=false;
commit();syncNow()})();
</script></body></html>
