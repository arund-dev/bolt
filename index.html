<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#f3ecdc">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><title>Lock In</title>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3ecdc;--card:#fbf6e8;--ln:#1b1b1b;--tx:#1b1b1b;--ac:#c8372d;--on:#fff;--ac2:#d6b66a;--ac3:#b9c4b8;--bw:4px;--sh:4px;--t:1;--hf:"Lilita One",Impact,sans-serif;--bf:Nunito,system-ui,sans-serif;--rd:255px 14px 225px 14px/14px 225px 14px 255px;--pat:radial-gradient(rgba(27,27,27,.09) 20%,transparent 22%)}
[data-theme=comicdark]{--bg:#1c1a17;--card:#2a2723;--ln:#efe6d0;--tx:#efe6d0;--ac:#d9473b;--ac2:#5a4a22;--ac3:#3e4a40;--pat:radial-gradient(rgba(255,255,255,.05) 20%,transparent 22%)}
[data-theme=min]{--bg:#f6f6f4;--card:#fff;--ln:#d6d6d0;--tx:#222;--ac:#222;--ac2:#ececE7;--ac3:#ececE7;--bw:1px;--sh:0px;--t:0;--rd:14px;--pat:none;--hf:Nunito,system-ui,sans-serif}
[data-theme=mindark]{--bg:#121212;--card:#1c1c1c;--ln:#363636;--tx:#e8e8e8;--ac:#e8e8e8;--on:#121212;--ac2:#2a2a2a;--ac3:#2a2a2a;--bw:1px;--sh:0px;--t:0;--rd:14px;--pat:none;--hf:Nunito,system-ui,sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg) var(--pat);background-size:14px 14px;color:var(--tx);font:600 15px var(--bf)}
.wrap{max-width:480px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top,0px)) 16px 130px}
.hf,h2,.btn,.cap,.chip,nav button,.seg button{font-family:var(--hf);font-weight:400;letter-spacing:.03em}
h2{font-size:36px;margin:0 0 18px;rotate:calc(var(--t)*-.5deg)}
.panel{background:var(--card);border:var(--bw) solid var(--ln);border-radius:var(--rd);box-shadow:var(--sh) var(--sh) 0 var(--ln);padding:18px 16px 16px;margin:0 0 24px;position:relative;rotate:calc(var(--r,0)*var(--t)*1deg)}
.panel:nth-child(even){border-radius:14px 225px 14px 255px/225px 14px 255px 14px}
.cap{position:absolute;top:-15px;left:12px;background:var(--ac2);border:var(--bw) solid var(--ln);border-radius:5px;padding:0 10px;font-size:17px;rotate:calc(var(--t)*-.8deg)}
.chip{display:inline-block;border:var(--bw) solid var(--ln);border-radius:5px;padding:0 8px;font-size:15px;margin:6px 6px 0 0;background:var(--ac3);rotate:calc(var(--r,0)*var(--t)*1deg)}
.btn{font-size:18px;background:var(--ac2);color:var(--tx);border:var(--bw) solid var(--ln);border-radius:8px 14px 9px 12px;box-shadow:var(--sh) var(--sh) 0 var(--ln);padding:8px 14px;cursor:pointer;rotate:calc(var(--r,0)*var(--t)*1deg)}
.btn:active{translate:2px 2px;box-shadow:none}.btn.p{background:var(--ac);color:var(--on)}.btn.g{background:var(--card)}.wide{width:100%;margin-bottom:24px}
.row{display:flex;gap:10px;margin-top:12px}.row>*{flex:1}.row.wrap{flex-wrap:wrap}
select,input,textarea{width:100%;font:inherit;color:var(--tx);background:var(--card);border:var(--bw) solid var(--ln);border-radius:8px;padding:9px;margin:6px 0}
.page{display:none}.page.on{display:block}small{opacity:.65}.ch{font-family:var(--hf);font-size:15px;opacity:.7;margin:0 0 16px;letter-spacing:.08em}
.nt{font-size:32px;line-height:1.15;margin:4px 0 6px}.bub{margin-top:6px}
.rw{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0}.rw em{font-style:normal;opacity:.65}
.mini{font:inherit;font-size:13px;background:none;border:2px solid var(--ln);border-radius:5px;color:var(--tx);padding:2px 7px;margin-left:4px}.mini.on{background:var(--ac2)}
.task{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:2px dashed var(--ln)}.task span{flex:1}
.box{width:26px;height:26px;border:var(--bw) solid var(--ln);border-radius:5px;flex:none;display:grid;place-items:center}.done .box{background:var(--ac2)}.done .box::after{content:"✓"}.done span,.skip span{opacity:.45;text-decoration:line-through}
.seg{display:flex;margin-bottom:24px}.seg button{flex:1;font-size:18px;border:var(--bw) solid var(--ln);background:var(--card);color:var(--tx);padding:6px 0;margin-left:-2px}.seg .on{background:var(--ac);color:var(--on)}
.moods{display:flex;justify-content:space-between}.moods button{font-size:28px;background:none;border:2px solid transparent;border-radius:6px;filter:grayscale(.7)}.moods .on{border-color:var(--ln);filter:none}
.pips{display:flex;gap:5px;margin:4px 0 10px}.pips i{width:20px;height:20px;border:2px solid var(--ln);border-radius:4px}.pips .f{background:var(--ac3)}
.days{display:flex;gap:4px;margin:8px 0}.days .btn{flex:1;padding:6px 0;font-size:15px;box-shadow:none}.days .on{background:var(--ac);color:var(--on)}
.avatar{display:grid;place-items:center;width:96px;height:96px;border-radius:50%;overflow:hidden;border:var(--bw) solid var(--ln);font-size:46px;margin-bottom:10px}.avatar img{width:100%;height:100%;object-fit:cover}
.wv{animation:wv 2.4s linear infinite}@keyframes wv{to{transform:translateX(40px)}}@media(prefers-reduced-motion:reduce){.wv{animation:none}}
nav{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:auto;display:grid;grid-template-columns:1fr 1fr 80px 1fr 1fr;background:var(--bg);border-top:var(--bw) solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
nav button{background:none;border:0;color:var(--tx);font-size:18px;padding:16px 0 12px}nav .on{box-shadow:inset 0 -4px 0 var(--ac)}
#homeBtn{position:fixed;left:50%;translate:-50% 0;bottom:calc(14px + env(safe-area-inset-bottom,0px));width:74px;height:74px;border-radius:50%;background:var(--ac);color:var(--on);border:var(--bw) solid var(--ln);font-size:32px;z-index:11}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;z-index:30}.modal.on{display:flex}
.sheet{width:100%;max-width:480px;margin:auto;background:var(--card);border:var(--bw) solid var(--ln);border-radius:16px 16px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));max-height:90vh;overflow:auto}
#login{position:fixed;inset:0;background:var(--bg);z-index:50;display:none;place-items:center;padding:20px}#login.on{display:grid}
</style></head><body>
<div class="wrap"><section class="page on" id="home"></section><section class="page" id="plan"></section><section class="page" id="later"></section><section class="page" id="log"></section><section class="page" id="me"></section></div>
<button id="homeBtn" data-a="nav" data-i="home" aria-label="Home">⚡</button>
<nav><button data-a="nav" data-i="plan">PLAN</button><button data-a="nav" data-i="later" id="nl">LATER</button><span></span><button data-a="nav" data-i="log">LOG</button><button data-a="nav" data-i="me">ME</button></nav>
<div class="modal" id="modal"><div class="sheet" id="sb"></div></div>
<div id="login"><div class="panel" style="width:100%;max-width:360px"><h2>Lock In</h2><input id="em" type="email" placeholder="email" autocomplete="username"><input id="pw" type="password" placeholder="password" autocomplete="current-password"><small id="lerr"></small><div class="row"><button class="btn g" id="skip">OFFLINE</button><button class="btn p" id="li">ENTER</button></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SB_URL='YOUR_SUPABASE_URL',SB_KEY='YOUR_SUPABASE_ANON_KEY';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const uid=()=>Math.random().toString(36).slice(2,9),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const iso=d=>{d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,0)+'-'+String(d.getDate()).padStart(2,0)};
const addD=(s,n)=>{const d=new Date(s+'T12:00');d.setDate(d.getDate()+n);return iso(d)},dow=s=>(new Date(s+'T12:00').getDay()+6)%7;
const PARTS=['morning','afternoon','evening','night'],DN=['M','T','W','T','F','S','S'],ME=['😫','😕','😐','🙂','🔥'];
const cmp=(a,b)=>PARTS.indexOf(a.part)-PARTS.indexOf(b.part)||(a.time||'99').localeCompare(b.time||'99');
const L=(title,type,days,part,time,size)=>({id:uid(),title,type,days,part,time:time||'',size:size||2});
const DEF={theme:'comic',chapter:'Finding my feet',bio:'',photo:'',
areas:[{id:'a1',name:'Money'},{id:'a2',name:'Education'},{id:'a3',name:'Life'},{id:'a4',name:'Skills'}],
types:[{id:'t1',area:'a1',name:'Job hunt'},{id:'t2',area:'a2',name:'A/L'},{id:'t3',area:'a2',name:'Coding'},{id:'t4',area:'a3',name:'Gym'},{id:'t5',area:'a3',name:'Health'},{id:'t6',area:'a4',name:'Daily life'}],
loop:[L('Job applications','t1',[0,1,2,3,4],'morning'),L('Study coding','t3',[0,1,2,3,4],'afternoon','',2),L('Gym','t4',[0,2,4],'evening','17:00'),L('Cook something new','t6',[5],'afternoon'),L('Tidy my space','t6',[6],'morning',' ',1)],
items:[],off:[],away:[],water:{},log:[],hyd:{lvl:.6,at:Date.now(),nt:0}};
let S=JSON.parse(localStorage.getItem('lockin')||'null')||structuredClone(DEF),sb,user,tmr,pg='home',seg='today',ev=0;['energy','ask','qa'].forEach(k=>delete S[k]);S.hyd=S.hyd||{lvl:.6,at:Date.now(),nt:0};
const ty=id=>S.types.find(x=>x.id==id)||{name:'Other'},free=d=>S.off.includes(d)||S.away.some(a=>d>=a.f&&d<=a.t),theme=()=>document.documentElement.dataset.theme=S.theme||'comic';
function save(){S.ts=Date.now();localStorage.setItem('lockin',JSON.stringify(S));clearTimeout(tmr);tmr=setTimeout(push,800)}
async function push(){if(!sb||!user)return;try{const{error}=await sb.from('app_state').upsert({user_id:user.id,data:S,updated_at:new Date().toISOString()});const s=$('#sync');if(s)s.textContent=error?'will retry when online':'synced'}catch(e){}}
async function pull(){const{data}=await sb.from('app_state').select('data').eq('user_id',user.id).maybeSingle();if(data&&data.data&&(data.data.ts||0)>(S.ts||0)){S=Object.assign(structuredClone(DEF),data.data);localStorage.setItem('lockin',JSON.stringify(S))}else push()}
addEventListener('online',push);
function ensure(d){if(free(d))return;S.loop.forEach(l=>{if(l.days.includes(dow(d))&&!S.items.some(i=>i.src==l.id&&i.od==d))S.items.push({id:uid(),src:l.id,od:d,date:d,title:l.title,type:l.type,part:l.part,time:(l.time||'').trim(),size:l.size,st:'todo',n:0})})}
function nextSlot(type,from){for(let k=0;k<60;k++){const d=addD(from,k);if(!free(d)&&S.loop.some(l=>l.type==type&&l.days.includes(dow(d))))return d}}
function moveNext(x,from){const d=nextSlot(x.type,from);if(d){x.date=d;x.carried=1;x.st='todo'}else x.st='later';x.n++}
const miss=x=>{x.st='later';x.n++};
function fix(){const T=iso();for(let k=0;k<8;k++)ensure(addD(T,k));S.items.forEach(x=>{if(x.date<T&&x.st=='todo')miss(x,T)});S.items=S.items.filter(x=>x.date>=addD(T,-120)||x.st=='todo'||x.st=='later');for(let k=0;k<8;k++)ensure(addD(T,k))}
const commit=()=>{fix();save();draw()};
function pick(){const T=iso(),l=S.items.filter(i=>i.date==T&&i.st=='todo').sort(cmp);if(!l.length||free(T))return[null,[]];return[l[0],l.slice(1)]}
const DR=4*36e5,LOW=.3;
function awake(a,b){let s=0;for(let t=a;t<b;t+=9e5){const h=new Date(t).getHours();if(h>=7&&h<22)s+=Math.min(9e5,b-t)}return s}
const lvl=()=>{const a=S.hyd.at;return Math.max(0,S.hyd.lvl-awake(a,Math.min(Date.now(),a+1728e5))/DR)},isAwake=()=>{const h=new Date().getHours();return h>=7&&h<22};
function notify(t,b){if('Notification'in window&&Notification.permission=='granted'&&navigator.serviceWorker)navigator.serviceWorker.ready.then(r=>r.showNotification(t,{body:b,icon:'icon-180.png',tag:'cc'}))}
function glass(){const w=$('#wt');if(!w)return;const l=lvl();w.style.transform=`translateY(${(1-l)*108}px)`;$('#wp').textContent=Math.round(l*100)+'%';$('#gsv').style.setProperty('--wc',l<LOW?'#d98a7a':'#7fb7c9');$('#wn').textContent=l<LOW?'Running low. Sip something.':l<.6?'Getting there. A few sips soon.':'Nicely topped up.'}
function chk(){if(!isAwake()||lvl()>=LOW||Date.now()-S.hyd.nt<36e5)return;S.hyd.nt=Date.now();save();notify('Lock In','Your glass is running low. Take a few sips?')}
function waterCard(){const l=lvl(),n=S.water[iso()]||0;
return`<div class="panel"><span class="cap">WATER</span><div class="row" style="align-items:center"><svg id="gsv" viewBox="0 0 84 116" width="96" style="flex:none;--wc:${l<LOW?'#d98a7a':'#7fb7c9'}"><defs><clipPath id="gc"><path d="M5 5H79L71 111H13Z"/></clipPath></defs><g clip-path="url(#gc)"><g id="wt" style="transform:translateY(${(1-l)*108}px);transition:transform 1s cubic-bezier(.3,1.3,.5,1)"><rect x="-10" y="8" width="104" height="130" fill="var(--wc)"/><path class="wv" d="M-30 8q10 -7 20 0t20 0t20 0t20 0t20 0t20 0t20 0t20 0t20 0" fill="var(--wc)"/></g></g><path d="M5 5H79L71 111H13Z" fill="none" stroke="var(--ln)" stroke-width="4" stroke-linejoin="round"/></svg><div><div class="hf" style="font-size:34px" id="wp">${Math.round(l*100)}%</div><small id="wn"></small><br><small>${n} glass${n==1?'':'es'} today</small></div></div><div class="row"><button class="btn p" data-a="sip">+ GLASS</button>${'Notification'in window&&Notification.permission=='default'?'<button class="btn g" data-a="notif">REMIND ME</button>':''}</div></div>`}
const moodRow=(a,v)=>`<div class="moods">${ME.map((m,i)=>`<button data-a="${a}" data-i="${i+1}" class="${v==i+1?'on':''}">${m}</button>`).join('')}</div>`;
function vHome(){const T=iso(),[n,rest]=pick(),h=new Date().getHours(),later=S.items.filter(i=>i.st=='later').length;
return`<div class="ch">CHAPTER · ${esc(S.chapter)}</div>
${free(T)?'<div class="panel"><span class="cap">TODAY</span>This day is set aside. Nothing is due. Rest well.</div>':`<div class="panel"><span class="cap">NEXT</span>${n?`<div class="hf nt">${esc(n.title)}</div><span class="chip">${esc(ty(n.type).name)}</span><span class="chip">${n.time||n.part}</span>${n.carried?'<span class="chip">carried over</span>':''}<div class="row"><button class="btn p" data-a="done" data-i="${n.id}">DONE</button><button class="btn" data-a="later" data-i="${n.id}">LATER</button></div>`:'<div class="hf nt">Nothing left.</div>Rest, or add something small in Plan.'}</div>`}
${rest.length?`<div class="panel"><span class="cap">COMING UP</span>${rest.slice(0,3).map(i=>`<div class="rw"><span>${esc(i.title)}</span><em>${i.time||i.part}</em></div>`).join('')}</div>`:''}
${later&&h>=19?`<div class="panel"><span class="cap">LATER BASKET</span>${later} waiting for a day.<div class="row"><button class="btn" data-a="nav" data-i="later">PLACE THEM</button></div></div>`:''}
${waterCard()}
${h>=19&&!S.log.some(l=>l.d==T&&l.k=='Day')?`<div class="panel"><span class="cap">EVENING</span>How did today go?${moodRow('mood',0)}<textarea id="evx" rows="2" placeholder="One line about today (optional)"></textarea><button class="btn p" data-a="evsave">SAVE</button></div>`:''}
${free(T)?'':'<button class="btn g wide" data-a="life">Life happened today</button>'}`}
function vPlan(){const T=iso(),sg=`<div class="seg">${['today','week','areas'].map(s=>`<button class="${seg==s?'on':''}" data-a="seg" data-i="${s}">${s.toUpperCase()}</button>`).join('')}</div>`;
if(seg=='today')return sg+`<div class="panel"><span class="cap">TODAY</span>${S.items.filter(i=>i.date==T&&i.st!='drop').sort(cmp).map(i=>`<div class="task ${i.st}"><div class="box" data-a="tog" data-i="${i.id}"></div><span data-a="tog" data-i="${i.id}">${esc(i.title)}</span><button class="mini" data-a="edit1" data-i="${i.id}">⋯</button></div>`).join('')||'Nothing today.'}</div><button class="btn wide" data-a="new1">+ ADD A TASK</button>`;
if(seg=='week')return sg+['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map((n,d)=>`<div class="panel"><span class="cap">${n}</span>${S.loop.filter(l=>l.days.includes(d)).sort(cmp).map(l=>`<div class="rw" data-a="editl" data-i="${l.id}"><span>${esc(l.title)}</span><em>${l.time.trim()||l.part}</em></div>`).join('')||'<small>free</small>'}</div>`).join('')+`<button class="btn wide" data-a="newl">+ ADD TO THE LOOP</button><div class="panel"><span class="cap">AWAY</span>${S.away.map((a,i)=>`<div class="rw"><span>${a.f} → ${a.t}</span><button class="mini" data-a="rmaway" data-i="${i}">✕</button></div>`).join('')}<div class="row"><input type="date" id="af" min="${T}"><input type="date" id="at" min="${T}"></div><button class="btn wide" style="margin:12px 0 0" data-a="away">SET AWAY</button></div>`;
return sg+S.areas.map(a=>`<div class="panel"><span class="cap">${esc(a.name)}</span>${S.types.filter(t=>t.area==a.id).map(t=>`<div class="rw"><span>${esc(t.name)}</span><span><button class="mini" data-a="rnt" data-i="${t.id}">✎</button><button class="mini" data-a="rmt" data-i="${t.id}">✕</button></span></div>`).join('')}<div class="row"><button class="btn" data-a="newt" data-i="${a.id}">+ TYPE</button><button class="btn g" data-a="rna" data-i="${a.id}">RENAME</button></div></div>`).join('')+'<button class="btn wide" data-a="newa">+ NEW AREA</button>'}
function vLater(){const l=S.items.filter(i=>i.st=='later');return'<h2>Later</h2>'+(l.map(i=>`<div class="panel"><span class="cap">${esc(ty(i.type).name)}</span>${esc(i.title)} <small>· pushed ${i.n}×</small><div class="row"><input type="date" id="d_${i.id}" min="${iso()}" value="${addD(iso(),1)}"><button class="btn p" data-a="place" data-i="${i.id}">PLACE</button></div><div class="row"><button class="btn" data-a="slot" data-i="${i.id}">NEXT SLOT</button><button class="btn g" data-a="drop" data-i="${i.id}">LET GO</button></div></div>`).join('')||'<div class="panel">The basket is empty.</div>')}
const vLog=()=>`<h2>The Log</h2><div class="panel"><select id="lk"><option>Note</option><option>Win</option><option>Reminder</option></select><textarea id="lx" rows="2" placeholder="What's on your mind?"></textarea><button class="btn p" data-a="logsave">SAVE</button></div>`+S.log.map(l=>`<div class="panel"><span class="cap">${l.k=='Day'?'DAY '+(ME[l.m-1]||''):esc(l.k)}</span><small>${l.d}</small><br>${esc(l.x||'')}</div>`).join('');
function vMe(){const w=S.items.filter(i=>i.st=='done'&&i.date>addD(iso(),-7));return`<h2>Me</h2><div class="panel"><span class="cap">MY BOOK</span><label class="avatar">${S.photo?`<img src="${S.photo}">`:'😎'}<input type="file" id="photo" accept="image/*" hidden></label><input id="chap" value="${esc(S.chapter)}" placeholder="Current chapter"><textarea id="bio" rows="3" placeholder="About me">${esc(S.bio)}</textarea></div><div class="panel"><span class="cap">THIS WEEK I…</span>${w.map(i=>`<div>✓ ${esc(i.title)}</div>`).join('')||'<small>Nothing yet. That is fine.</small>'}</div><div class="panel"><span class="cap">LOOK</span><select id="theme">${[['comic','Comic'],['comicdark','Comic dark'],['min','Minimal light'],['mindark','Minimal dark']].map(([v,n])=>`<option value="${v}" ${S.theme==v?'selected':''}>${n}</option>`).join('')}</select><small id="sync">${user?'signed in':'local only'}</small>${user?'<div class="row"><button class="btn g" data-a="out">SIGN OUT</button></div>':''}</div>`}
function tilt(){$$('.panel,.btn,.chip').forEach(e=>{let h=0;for(const c of e.textContent+e.className)h=(h*31+c.charCodeAt(0))>>>0;e.style.setProperty('--r',((h%41)/10-2)*(e.classList.contains('panel')?.25:.45))})}
function draw(){theme();const n=S.items.filter(i=>i.st=='later').length;$$('.page').forEach(p=>p.classList.toggle('on',p.id==pg));$$('nav button[data-i]').forEach(b=>b.classList.toggle('on',b.dataset.i==pg));$('#nl').textContent='LATER'+(n?' '+n:'');$('#'+pg).innerHTML={home:vHome,plan:vPlan,later:vLater,log:vLog,me:vMe}[pg]();tilt();glass()}
function sheet(o,mode){const isL=mode=='loop';$('#sb').innerHTML=`<h2 style="font-size:30px">${o.id?'Edit':'New'} ${isL?'loop task':'task'}</h2><input id="f_t" placeholder="What?" value="${esc(o.title||'')}"><select id="f_ty">${S.areas.map(a=>`<optgroup label="${esc(a.name)}">${S.types.filter(t=>t.area==a.id).map(t=>`<option value="${t.id}" ${t.id==o.type?'selected':''}>${esc(t.name)}</option>`).join('')}</optgroup>`).join('')}</select>${isL?`<div class="days">${DN.map((d,i)=>`<button class="btn g ${(o.days||[]).includes(i)?'on':''}" data-d="${i}">${d}</button>`).join('')}</div>`:`<input id="f_d" type="date" value="${o.date||iso()}">`}<div class="row"><select id="f_p">${PARTS.map(p=>`<option ${p==o.part?'selected':''}>${p}</option>`).join('')}</select><input id="f_tm" type="time" value="${(o.time||'').trim()}"><select id="f_s">${[1,2,3].map(n=>`<option value="${n}" ${n==(o.size||2)?'selected':''}>${['small','medium','big'][n-1]}</option>`).join('')}</select></div><div class="row">${o.id?'<button class="btn g" id="f_x">DELETE</button>':''}<button class="btn g" id="f_c">CANCEL</button><button class="btn p" id="f_ok">SAVE</button></div>`;
$('#modal').classList.add('on');const close=()=>$('#modal').classList.remove('on'),T=iso(),purge=l=>{S.items=S.items.filter(i=>!(i.src==l.id&&i.st=='todo'&&!i.carried&&i.date>=T))};
$$('.days .btn').forEach(b=>b.onclick=()=>b.classList.toggle('on'));$('#f_c').onclick=close;
if($('#f_x'))$('#f_x').onclick=()=>{if(isL){S.loop=S.loop.filter(x=>x!=o);purge(o)}else o.st='drop';close();commit()};
$('#f_ok').onclick=()=>{const v={title:$('#f_t').value.trim(),type:$('#f_ty').value,part:$('#f_p').value,time:$('#f_tm').value,size:+$('#f_s').value};if(!v.title)return;
if(isL){v.days=$$('.days .on').map(b=>+b.dataset.d);if(!v.days.length)return;if(o.id){Object.assign(o,v);purge(o)}else S.loop.push({id:uid(),...v})}
else{v.date=$('#f_d').value||T;if(o.id)Object.assign(o,v);else S.items.push({id:uid(),od:v.date,st:'todo',n:0,...v})}close();commit()}}
function act(a,i,b){const T=iso(),it=S.items.find(x=>x.id==i),ar=S.areas.find(x=>x.id==i),tp=S.types.find(x=>x.id==i);
switch(a){
case'nav':pg=i;scrollTo(0,0);break;
case'seg':seg=i;break;case'notif':Notification.requestPermission().then(draw);return;
case'done':it.st='done';break;
case'later':it.st='later';it.n++;break;
case'sip':S.hyd={lvl:Math.min(1,lvl()+.5),at:Date.now(),nt:0};S.water[T]=(S.water[T]||0)+1;break;
case'life':S.off.push(T);S.items.filter(x=>x.date==T&&x.st=='todo').forEach(x=>miss(x,addD(T,1)));break;
case'drop':it.st='drop';break;
case'tog':it.st=it.st=='done'?'todo':'done';break;
case'place':{const d=$('#d_'+i).value;if(d){it.date=d;it.st='todo';it.carried=1}break}
case'slot':moveNext(it,addD(T,1));break;
case'new1':sheet({date:T,part:'morning'},'one');return;case'edit1':sheet(it,'one');return;
case'newl':sheet({days:[0,1,2,3,4],part:'morning'},'loop');return;case'editl':sheet(S.loop.find(x=>x.id==i),'loop');return;
case'rnt':{const n=prompt('Rename type',tp.name);if(n)tp.name=n;break}
case'rmt':if(confirm('Remove this type?'))S.types=S.types.filter(x=>x!=tp);break;
case'newt':{const n=prompt('New type name');if(n)S.types.push({id:uid(),area:i,name:n});break}
case'rna':{const n=prompt('Rename area',ar.name);if(n)ar.name=n;break}
case'newa':{const n=prompt('New area name');if(n)S.areas.push({id:uid(),name:n});break}
case'away':{const f=$('#af').value,t=$('#at').value;if(!f||!t||t<f)return;S.away.push({f,t});S.items.filter(x=>x.date>=f&&x.date<=t&&x.st=='todo').forEach(x=>miss(x,addD(t,1)));break}
case'rmaway':S.away.splice(+i,1);break;
case'mood':ev=+i;$$('[data-a=mood]').forEach(x=>x.classList.toggle('on',x.dataset.i==i));return;
case'evsave':S.log.unshift({d:T,k:'Day',m:ev,x:$('#evx').value.trim()});break;
case'logsave':{const x=$('#lx').value.trim();if(!x)return;S.log.unshift({d:T,k:$('#lk').value,x});break}
case'out':sb.auth.signOut();user=null;$('#login').classList.add('on');return}
commit()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b)act(b.dataset.a,b.dataset.i,b)});
document.addEventListener('change',e=>{const i=e.target.id;if(i=='chap')S.chapter=e.target.value;else if(i=='bio')S.bio=e.target.value;else if(i=='theme'){S.theme=e.target.value;theme()}else if(i=='photo'){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=256;const m=Math.min(im.width,im.height);c.getContext('2d').drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,256,256);S.photo=c.toDataURL('image/jpeg',.8);commit()};im.src=r.result};r.readAsDataURL(f);return}else return;save()});
$('#li').onclick=async()=>{const{data,error}=await sb.auth.signInWithPassword({email:$('#em').value,password:$('#pw').value});if(error)return $('#lerr').textContent=error.message;user=data.user;$('#login').classList.remove('on');try{await pull()}catch(e){}commit()};
$('#skip').onclick=()=>$('#login').classList.remove('on');
document.addEventListener('visibilitychange',()=>{if(!document.hidden){commit();chk()}});
let lastH=new Date().getHours();setTimeout(chk,2000);
setInterval(()=>{glass();chk();const h=new Date().getHours(),ed=document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);if(h!=lastH&&pg=='home'&&!ed&&!document.hidden)draw();lastH=h},30000);
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
(async()=>{if(window.supabase&&!SB_URL.startsWith('YOUR')){sb=supabase.createClient(SB_URL,SB_KEY);try{const{data}=await sb.auth.getSession();user=data.session&&data.session.user;if(user)await pull()}catch(e){}if(!user)$('#login').classList.add('on')}commit()})();
</script></body></html>
